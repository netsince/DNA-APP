name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      # 版本分支：后续加功能统一在 versionbranch/<版本号> 上做。
      - "versionbranch/**"
      # 临时：让这条分支在合并前也能跑 CI。push 事件用的是被推 ref 自己的
      # workflow 文件，所以这样能生效；合并进 main 后可以删掉这一行。
      - feat/flutter-3.50-update
  pull_request:
    branches:
      - main
      - master
      # 版本分支：允许「功能分支 → versionbranch/<版本号>」的 PR 也跑 CI。
      # 之前只写 main/master，导致 PR #76、#77 这种合进功能分支的 PR 完全没有检查项。
      - "versionbranch/**"
  # 手动触发。注意 GitHub 只在默认分支上暴露「Run workflow」按钮，
  # 所以这条分支阶段按不出效果，留给合并之后用。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 固定 Flutter 版本：channel: stable 会自动拉到最新 stable，构建环境随之漂移。
          # 3.50 起 Android 最低 Gradle 提到 9.3.1、Material 拆成独立包 material_ui；
          # 本项目已配套升到 Gradle 9.5.0 / AGP 9.3.1 / Kotlin 2.4.20（AGP 内置 Kotlin），
          # 因此这里跟本机一致钉在 3.50.1。
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze


  build:
    name: Build (${{ matrix.platform }})
    needs: analyze
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: web
            runner: ubuntu-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 固定 Flutter 版本：channel: stable 会自动拉到最新 stable，构建环境随之漂移。
          # 3.50 起 Android 最低 Gradle 提到 9.3.1、Material 拆成独立包 material_ui；
          # 本项目已配套升到 Gradle 9.5.0 / AGP 9.3.1 / Kotlin 2.4.20（AGP 内置 Kotlin），
          # 因此这里跟本机一致钉在 3.50.1。
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - run: flutter pub get

      - name: Build Android (APK)
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build Web
        if: matrix.platform == 'web'
        run: flutter build web --release
