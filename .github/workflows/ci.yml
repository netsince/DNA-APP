name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 固定 Flutter 版本：channel: stable 会自动拉到最新 stable，构建环境随之漂移。
          # 2026-11 的 3.50.0 把最低 Gradle 提到 9.3.1，而本项目是 Gradle 8.14，
          # 导致 v0.3.6 的 Android 构建直接失败。3.47.8 是 v0.3.5 成功构建的确切版本。
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze


  build:
    name: Build (${{ matrix.platform }})
    needs: analyze
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: web
            runner: ubuntu-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 固定 Flutter 版本：channel: stable 会自动拉到最新 stable，构建环境随之漂移。
          # 2026-11 的 3.50.0 把最低 Gradle 提到 9.3.1，而本项目是 Gradle 8.14，
          # 导致 v0.3.6 的 Android 构建直接失败。3.47.8 是 v0.3.5 成功构建的确切版本。
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - run: flutter pub get

      - name: Build Android (APK)
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build Web
        if: matrix.platform == 'web'
        run: flutter build web --release
