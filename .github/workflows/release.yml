name: Release

# 只在「发布 release」时构建一次。
#
# 以前同时监听 release: published 和 push: tags: v*，打 tag 再发 release 会各触发一次，
# 同一个版本白白构建两遍（22 个版本共 44 次运行，其中一半是重复构建）。
# 现在只认 release 事件；手动补构建请用「Manual Build」那个 workflow。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ios-secrets-check:
    name: Check iOS signing secrets
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        env:
          IOS_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_PWD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PP: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$IOS_P12" ] && [ -n "$IOS_PWD" ] && [ -n "$IOS_PP" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

  # 正式包：每次 release 都构建，只出 release 产物。
  # 平台矩阵与构建步骤在 build-platforms.yml 里定义，这里只传类型。
  build-release:
    uses: ./.github/workflows/build-platforms.yml
    with:
      type: release
    secrets: inherit

  # 调试包：只有 pre-release 才构建。
  #
  # 用 release 的 prerelease 标志判断，比解析 tag 名可靠
  #（实测 v0.3.3-pre1 = true、v0.3.2 = false）。
  # 正式版不再出 debug，macOS / Windows 的排队压力直接少一半。
  build-debug:
    if: github.event.release.prerelease == true
    uses: ./.github/workflows/build-platforms.yml
    with:
      type: debug
    secrets: inherit

  ios:
    name: Build iOS (requires signing secrets)
    needs: ios-secrets-check
    if: needs.ios-secrets-check.outputs.has-secrets == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install the Apple certificate and provisioning profile
        env:
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "${{ secrets.IOS_DIST_CERT_P12 }}" | base64 --decode -o "$CERT_PATH"
          echo -n "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles
      - run: flutter pub get
      - name: Build IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: build/ios/ipa/*.ipa
