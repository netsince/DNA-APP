# 16 GB 的机器上原来给守护进程开 8 GB 堆 + 4 GB Metaspace，Android release 构建中途
# 还要起 Kotlin worker / D8 / R8，物理内存与页面文件一起被打穿（实测 JVM 连 1.8MB 都
# 分配不出来，hs_err 里 TotalPageFile 可用只剩 7MB）。降到 4 GB 堆 + 1 GB Metaspace，
# 并限制并发峰值。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=3
org.gradle.parallel=false
android.useAndroidX=true
# 内置 Kotlin（AGP 9 起默认）：app 不再自己 apply kotlin-android 插件，
# Kotlin 编译由 AGP 内置提供。Flutter 的迁移器只要看到已存在的 android.builtInKotlin
# 行就会跳过（不会改回 false），所以这里显式写 true 是稳定的。
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
