group 'com.fluttercandies.flutter_image_compress'
version '1.0-SNAPSHOT'

// Keep this top-level: a conditional buildscript block can run after Gradle
// has resolved the script classpath (see issue #400).
buildscript {
    ext.kotlin_version = '1.8.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// ===== 本地分叉说明（vendored fork）=====
// 与上游 1.1.1 的唯一区别：删掉了「不支持内置 Kotlin 时才 apply KGP」的遗留分支。
//
// 上游那份写法在运行时是对的（AGP 9 下内置 Kotlin 生效，不会真的 apply KGP），
// 但 Flutter 的迁移检查是**按行正则扫 build 脚本文本**（flutter_tools 的
// FlutterPluginUtils.kt，注释里写明「inspects build script files directly via
// regex rather than querying Gradle plugin state」），它看不见外面的 if，
// 于是每次构建都报「该插件仍 apply Kotlin Gradle Plugin」。
//
// 本项目只跑 AGP 9 且 android.builtInKotlin=true，内置 Kotlin 恒为真，
// 所以这里只保留内置写法。上游修好之前，升级本包时需要把这份改动重新应用。
// =====================================

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.fluttercandies.flutter_image_compress'
    }

    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    // 1.3.7+ fixes several WebP writer bugs relevant to keepExif=true on
    // WebP output: VP8-only / VP8L-only streams (which Bitmap.compress emits
    // for lossy/lossless WebP without a VP8X header), corrupted output for
    // WebP > 8191px, "invalid APP1 marker" writes, and the VP8X E flag not
    // getting set on the RIFF header so viewers didn't look at the EXIF
    // chunk. 1.3.3 pre-dates all of these. If bumped, also bump the
    // KEEP-IN-SYNC copy in the example app: packages/flutter_image_compress/
    // example/android/app/build.gradle.kts.
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.heifwriter:heifwriter:1.0.0'
    implementation 'commons-io:commons-io:2.16.1'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
